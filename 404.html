<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Pineapple Games</title>
  <link rel="icon" type="image/png" href="/Games/assets/img/pineapple.png">
  <link rel="stylesheet" href="/Games/assets/css/style.css">
  <style>
    .notfound {
      min-height: 68vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: .6rem;
    }
    .notfound h1 {
      font-size: clamp(4rem, 18vw, 8rem);
      line-height: .9;
      letter-spacing: -.04em;
      margin: 0;
    }
    .notfound p {
      font-size: 1.25rem;
      color: var(--text-dim);
      margin: .2rem 0 1.2rem;
    }
  </style>
  <script>
    (function(){
      var t=new Image();
      t.onerror=function(){
        document.querySelectorAll('link[href^=\"/Games/\"], a[href^=\"/Games/\"], img[src^=\"/Games/\"], script[src^=\"/Games/\"]').forEach(function(el){
          var a=el.hasAttribute('href')?'href':'src';
          var v=el.getAttribute(a);
          if(v) el.setAttribute(a, v.replace(/^\/Games\//, './'));
        });
      };
      t.src='/Games/assets/img/pineapple.png';
    })();
  </script>
</head>
<body>
  <main class="content notfound">
    <h1>404</h1>
    <p>¿Te has perdido?</p>
    <a class="btn primary big" href="/Games/">Volver</a>
  </main>
  <script src="/Games/assets/js/site.js" defer></script>
  <script src="/Games/assets/js/analytics.js" defer></script>
</body>
</html>
